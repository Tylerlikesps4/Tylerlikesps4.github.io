<article class="card post-card">
  <p class="meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%-d %B %Y" }}</time>{% if include.post.draft_by %} &middot; <span class="badge badge-draft">Draft</span>{% endif %}</p>
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
  <p>{{ include.post.excerpt | strip_html | truncatewords: 38 }}</p>
  {% if include.post.tags.size > 0 %}<p class="tags">{% for t in include.post.tags %}<a href="{{ '/blog/tags/' | relative_url }}#{{ t | slugify }}">#{{ t }}</a>{% endfor %}</p>{% endif %}
</article>
