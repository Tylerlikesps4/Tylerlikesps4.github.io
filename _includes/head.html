<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e0b10">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>
  /* Set the theme before first paint so there's no flash. */
  document.documentElement.className += " js";
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") t = "dark"; /* dark by default; the toggle remembers a choice */
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  })();
</script>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/icon.svg' | relative_url }}" type="image/svg+xml">
{% feed_meta %}
{% seo %}
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
